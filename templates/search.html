{% extends "base.html" %}{% block content %}
<div class="page-head"><h1>Search results</h1></div>
{% if papers %}
<table class="papers">
  <thead><tr><th>Title</th><th>Module</th><th>Year</th><th>Type</th><th>Actions</th></tr></thead>
  <tbody>
  {% for p in papers %}
    <tr>
      <td>{{ p['title'] }}</td>
      <td>{{ p['module_slug'] }}</td>
      <td>{{ p['year'] or '' }}</td>
      <td>{{ p['paper_type'] }}</td>
      <td class="actions"><a class="btn" href="{{ url_for('preview', paper_id=p['id']) }}" target="_blank">Preview</a> <a class="btn" href="{{ url_for('download', paper_id=p['id']) }}">Download</a></td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p>No results found.</p>
{% endif %}
{% endblock %}
